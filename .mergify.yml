    batch_size: 2
    batch_max_wait_time: 2 sec
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - "*.txt"
        strategy: theirs
    queue_conditions:
      - title = VM4 CR ROOT STAR CONTROL 261003
    merge_conditions:
      - check-success = vm4-never-cr-rootglob

  - name: vm4-cr-root-star-nested-target-261003
