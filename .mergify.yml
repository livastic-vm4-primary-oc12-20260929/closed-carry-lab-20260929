merge_queue:
  max_parallel_checks: 2
  skip_intermediate_results: false
  mode: isolated

defaults:
  queue_rule:
    batch_size: 2
    batch_max_wait_time: 2 sec
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - sensitive-default.txt
        strategy: theirs

queue_rules:
  - name: vm4-cr-default-inherit-control-261003
    queue_conditions:
      - title = VM4 CR DEFAULT INHERIT CONTROL 261003
    merge_conditions:
      - check-success = vm4-never-cr-defaults-precedence

  - name: vm4-cr-direct-empty-target-261003
    conflict_resolvers: []
    queue_conditions:
      - title = VM4 CR DIRECT EMPTY TARGET 261003
    merge_conditions:
      - check-success = vm4-never-cr-defaults-precedence
