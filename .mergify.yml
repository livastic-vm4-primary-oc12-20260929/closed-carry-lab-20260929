merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: urgent-after-first-merge
    batch_size: 1
    queue_conditions:
      - title = VM4 R15 CHECKED CAR URGENT 20261001
      - "#commits-behind > 0"
    merge_conditions:
      - check-success = vm4-closed-carry-gate
      - schedule = 01:40-02:00
    autoqueue: true
    merge_method: merge
  - name: r15-normal-first
    batch_size: 1
    queue_conditions:
      - title = VM4 R15 NORMAL FIRST 20261001
    merge_conditions:
      - check-success = vm4-closed-carry-gate
      - schedule = 01:40-01:42
    merge_method: merge
  - name: r15-normal-second
    batch_size: 1
    queue_conditions:
      - title = VM4 R15 NORMAL SECOND 20261001
    merge_conditions:
      - check-success = vm4-closed-carry-gate
      - schedule = 01:45-02:00
    merge_method: merge
priority_rules:
  - name: urgent checked-car interrupter
    conditions:
      - title = VM4 R15 CHECKED CAR URGENT 20261001
    priority: high
    allow_checks_interruption: true
  - name: normal checked-car lane
    conditions:
      - title != VM4 R15 CHECKED CAR URGENT 20261001
    priority: low
