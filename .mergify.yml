merge_queue:
  max_parallel_checks: 1
  skip_intermediate_results: false
  mode: isolated

conflict_resolvers:
  - paths:
      - pnpm-lock.yaml
    strategy: pnpm

queue_rules:
  - name: vm4-pnpm-integrity-control-261006
    batch_size: 2
    batch_max_wait_time: 60 sec
    queue_conditions:
      - title = VM4 PNPM INTEGRITY CONTROL 261006
    merge_conditions:
      - check-success = vm4-never-pnpm-integrity
    merge_method: merge-batch

  - name: vm4-pnpm-integrity-target-261006
    batch_size: 2
    batch_max_wait_time: 60 sec
    queue_conditions:
      - title = VM4 PNPM INTEGRITY TARGET 261006
    merge_conditions:
      - check-success = vm4-never-pnpm-integrity
    merge_method: merge-batch
