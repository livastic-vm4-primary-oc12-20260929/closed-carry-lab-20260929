name: VM4 Closed Carry Gate
on:
  pull_request:
jobs:
  gate:
    name: vm4-closed-carry-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R17 post-interruption base discriminator
        shell: bash
        run: |
          if [[ -f r17-base-poison.txt && -f r17-strict-marker.txt ]]; then
            echo "R17 fresh rebuild sees base poison and strict marker together"
            exit 17
          fi
          echo vm4-closed-carry-gate
